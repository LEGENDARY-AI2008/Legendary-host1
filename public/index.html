<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LËGĒNDÃRY HOST: deploy your WhatsApp bot</title>
<style>
:root{--bg:#e8ecf2;--ink:#0f1b2d;--mut:#55627a;--card:#fff;--line:#cfd7e3;--acc:#1f4fd8;--ok:#13795b;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;letter-spacing:-.5px}
p.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;border-radius:8px;font:inherit;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-size:14px;margin:12px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:74px;resize:vertical;word-break:break-all}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px}.row>div{flex:1}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:600 16px Georgia,serif;cursor:pointer}
.go:disabled{opacity:.6}
.sm{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.msg{margin-top:12px;font-size:15px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.hide{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.pill{padding:3px 10px;border-radius:99px;background:#e9efff;font-size:14px}
pre{background:#0f1b2d;color:#d6e2f5;border-radius:8px;padding:12px;height:300px;overflow:auto;font:12.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
a{color:var(--acc)}
.tip{margin-top:14px;font-size:15px;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Deploy your WhatsApp bot</h1>
  <p class="sub">Paste your session ID, fill your details, and your bot go live. No GitHub, no setup.</p>

  <section id="auth" class="card">
    <div class="tabs"><button id="t1" class="on">Deploy</button><button id="t2">Login</button></div>
    <form id="f1">
      <label for="sid">Session ID</label><textarea id="sid" required></textarea>
      <div class="row"><div><label for="num">Your WhatsApp number</label><input id="num" inputmode="numeric" placeholder="234XXXXXXXXXX" required></div>
      <div><label for="own">Your name</label><input id="own" maxlength="30" required></div></div>
      <div class="row"><div><label for="bn">Bot name</label><input id="bn" maxlength="30" placeholder="LËGĒNDÃRY BØT"></div>
      <div><label for="pf">Prefix</label><input id="pf" maxlength="3" value="."></div></div>
      <div class="row"><div><label for="wt">Mode</label><select id="wt"><option value="public">Public</option><option value="private">Private</option></select></div>
      <div><label for="tz">Timezone</label><input id="tz" value="Africa/Lagos"></div></div>
      <button class="go" id="b1">Deploy my bot</button>
    </form>
    <form id="f2" class="hide">
      <label for="sid2">Session ID</label><textarea id="sid2" required></textarea>
      <button class="go" id="b2">See my bot</button>
    </form>
    <div id="m" class="msg"></div>
  </section>

  <section id="dash" class="card hide">
    <div class="bar"><span class="pill" id="st">checking...</span><a id="lnk" target="_blank" rel="noopener"></a></div>
    <div class="bar"><button class="sm" id="cp">Copy link</button><button class="sm" id="rs">Restart bot</button><button class="sm" id="out">Log out</button></div>
    <pre id="log">Waiting for logs...</pre>
    <p class="tip">Your link must get traffic or Render go put the bot to sleep. Add this link to an uptime pinger (like UptimeRobot) to keep am awake.</p>
    <div id="dm" class="msg"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('lh');let timer;
async function api(path,opt={}){const r=await fetch('/api/'+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')}});
  const d=await r.json().catch(()=>({}));if(r.status===401){out();throw new Error(d.error||'Login again')}if(!r.ok)throw new Error(d.error||'Something fail');return d}
const say=(el,t,c)=>{el.textContent=t;el.className='msg '+(c||'')};
function tab(n){$('f1').classList.toggle('hide',n!==1);$('f2').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);say($('m'),'')}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function enter(t){token=t;localStorage.setItem('lh',t);$('auth').classList.add('hide');$('dash').classList.remove('hide');load();clearInterval(timer);timer=setInterval(load,6000)}
function out(){token=null;localStorage.removeItem('lh');clearInterval(timer);$('dash').classList.add('hide');$('auth').classList.remove('hide')}
async function load(){try{const s=await api('status');$('lnk').href=s.url;$('lnk').textContent=s.url;
  $('st').textContent=s.suspended==='suspended'?'Suspended':(s.deploy==='live'?'Live':'Status: '+(s.deploy||'starting'));
  const l=await api('logs');const p=$('log');const bottom=p.scrollTop+p.clientHeight>=p.scrollHeight-20;
  p.textContent=l.lines.join('\n')||'No logs yet. Build dey start.';if(bottom)p.scrollTop=p.scrollHeight}catch(e){say($('dm'),e.message,'bad')}}
$('f1').onsubmit=async e=>{e.preventDefault();$('b1').disabled=true;say($('m'),'Deploying... e fit take small time.');
  try{const d=await api('deploy',{method:'POST',body:JSON.stringify({sessionId:$('sid').value,ownerNumber:$('num').value,ownerName:$('own').value,botName:$('bn').value,prefix:$('pf').value,workType:$('wt').value,timezone:$('tz').value})});enter(d.token)}
  catch(err){say($('m'),err.message,'bad')}$('b1').disabled=false};
$('f2').onsubmit=async e=>{e.preventDefault();$('b2').disabled=true;
  try{const d=await api('login',{method:'POST',body:JSON.stringify({sessionId:$('sid2').value})});enter(d.token)}catch(err){say($('m'),err.message,'bad')}$('b2').disabled=false};
$('cp').onclick=()=>navigator.clipboard.writeText($('lnk').href).then(()=>say($('dm'),'Link copied','ok'));
$('rs').onclick=async()=>{try{await api('restart',{method:'POST'});say($('dm'),'Restarting...','ok')}catch(e){say($('dm'),e.message,'bad')}};
$('out').onclick=out;
if(token){enter(token)}
</script>
</body>
</html>
